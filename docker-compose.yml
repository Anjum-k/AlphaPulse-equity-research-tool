services:
  equity-research-tool:
    build: .
    container_name: equity_research_terminal
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEFAULT_VECTOR_DB=FAISS
      - DEFAULT_LLM_MODEL=gpt-4o-mini
    volumes:
      - ./data:/app/data
    restart: unless-stopped
